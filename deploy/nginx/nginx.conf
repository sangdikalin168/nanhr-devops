# Docker's embedded DNS. Using variables in proxy_pass makes nginx re-resolve
# service names, so recreated containers (new IPs) work without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /api/ {
        set $api_node http://api-node:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_node;
    }

    location /py/ {
        set $api_fastapi http://api-fastapi:8000;
        rewrite ^/py/(.*)$ /$1 break;
        proxy_pass $api_fastapi;
    }

    location / {
        set $web http://web:8080;
        proxy_pass $web;
    }
}
