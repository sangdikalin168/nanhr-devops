name: nanhr

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: { condition: service_healthy }
      api-node: { condition: service_healthy }
      api-fastapi: { condition: service_healthy }

  web:
    image: ${REGISTRY:-ghcr.io/sangdikalin168}/nanhr-web:${IMAGE_TAG:-latest}
    build: ../services/web
    restart: unless-stopped

  api-node:
    image: ${REGISTRY:-ghcr.io/sangdikalin168}/nanhr-api-node:${IMAGE_TAG:-latest}
    build: ../services/api-node
    restart: unless-stopped
    environment:
      APP_VERSION: ${IMAGE_TAG:-latest}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }

  api-fastapi:
    image: ${REGISTRY:-ghcr.io/sangdikalin168}/nanhr-api-fastapi:${IMAGE_TAG:-latest}
    build: ../services/api-fastapi
    restart: unless-stopped
    environment:
      APP_VERSION: ${IMAGE_TAG:-latest}
      ROOT_PATH: /py
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Public HTTPS through Cloudflare Tunnel; no inbound ports needed on the LAN.
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [proxy]
    profiles: [prod]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - kuma:/app/data
    profiles: [prod]

volumes:
  pgdata:
  kuma:
